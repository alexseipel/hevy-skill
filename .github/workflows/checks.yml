name: checks

on:
  push:
    branches: [main]
  pull_request:
  # Lets the drift job run on demand, instead of waiting for Monday.
  workflow_dispatch:
  schedule:
    # Weekly, so a change to Hevy's spec surfaces as a failing job rather than
    # as a wrong answer in somebody's editor. GitHub pauses schedules after 60
    # days without repository activity; a push resumes them.
    - cron: "17 6 * * 1"

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
      - name: Validate skill layout, frontmatter, links and secrets
        run: python3 scripts/validate_skill.py
      - name: Check every API operation is covered
        run: python3 scripts/check_coverage.py
      - name: Check the corrected spec matches its patches
        run: python3 scripts/build_corrected_spec.py --check
      - name: Run the offline client tests
        run: python3 -m unittest discover -s tests

  compat:
    # Test the supported floor and the current release.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - name: Run the offline client tests
        run: python3 -m unittest discover -s tests

  upstream-drift:
    # Scheduled or started by hand: it reaches the network, so it must not
    # gate a pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          check-latest: true
      - name: Re-pin upstream and re-apply every correction
        run: python3 scripts/build_corrected_spec.py --fetch
      - name: Check coverage against the fetched API
        run: python3 scripts/check_coverage.py
      - name: Report what moved
        if: always()
        run: |
          if ! git diff --quiet -- skills/hevy-api/openapi.json skills/hevy-api/openapi.corrected.json; then
            echo "::warning::Hevy's OpenAPI document changed. Review the diff."
            git diff -- skills/hevy-api/openapi.json skills/hevy-api/openapi.corrected.json
            exit 1
          fi
          echo "No specification diff in this checkout."
