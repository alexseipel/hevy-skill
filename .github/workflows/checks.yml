name: checks

on:
  push:
    branches: [main]
  pull_request:
  # Lets the drift job run on demand, instead of waiting for Monday.
  workflow_dispatch:
  schedule:
    # Weekly, so a change to Hevy's spec surfaces as a failing job rather than
    # as a wrong answer in somebody's editor. GitHub pauses schedules after 60
    # days without repository activity; a push resumes them.
    - cron: "17 6 * * 1"

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate skill layout, frontmatter, links and secrets
        run: python3 scripts/validate_skill.py
      - name: Check every API operation is covered
        run: python3 scripts/check_coverage.py
      - name: Check the corrected spec matches its patches
        run: python3 scripts/build_corrected_spec.py --check
      - name: Run the offline client tests
        run: python3 -m unittest discover -s tests

  compat:
    # The client documents Python 3.9 or newer, so the floor and the current
    # release both execute the claim rather than assert it.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run the offline client tests
        run: python3 -m unittest discover -s tests

  upstream-drift:
    # Scheduled or started by hand: it reaches the network, so it must not
    # gate a pull request.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Re-pin upstream and re-apply every correction
        run: python3 scripts/build_corrected_spec.py --fetch
      - name: Report what moved
        run: |
          if ! git diff --quiet; then
            echo "::warning::Hevy's OpenAPI document changed. Review the diff."
            git diff --stat
            exit 1
          fi
          echo "Upstream unchanged."
